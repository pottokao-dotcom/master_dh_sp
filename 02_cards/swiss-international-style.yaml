code: swiss-international-style
label_zh: "瑞士國際主義平面設計"
medium: design
aspect: '2:3'
palette: colour
look_paragraph: >
  A Swiss International Style design laid out on a strict modular grid with objective, rational
  clarity. Type is a neo-grotesque sans-serif set flush left and ragged right, in a few sizes
  only, with large bold headlines and small precise text blocks aligned to the grid columns. The
  picture sits inside a clean rectangle or bleeds off one edge, placed asymmetrically, balanced
  by generous white space. Colour is limited and flat — black, white and one strong accent such
  as signal red — with geometric bars, circles or rules structuring the page. Printed crisply,
  every element in exact alignment, calm and dynamic at once.
picture_paragraph: "The picture is a clean black-and-white or single-colour duotone photograph cropped hard into a rectangle of the grid, sharp and objective."
page_paragraph: "The page is a Swiss International Style layout on a strict modular grid: neo-grotesque sans-serif set flush left and ragged right, a few sizes only, large bold headlines and small precise text blocks aligned to the columns. The picture sits in a clean rectangle or bleeds off one edge, placed asymmetrically, reproduced as it is, balanced by generous white space. Page colour is limited and flat — black, white and one strong accent such as signal red — with geometric bars, circles or rules structuring the page."   # v4.1 複合專用:設計師第二棒,只管頁面,不重畫圖
