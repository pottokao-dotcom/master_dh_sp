code: bada_shanren_style
label_zh: "八大山人寫意水墨 (bada_shanren_style)"
medium: painting
aspect: '2:3'
palette: monochrome
look_paragraph: >
  A Chinese ink painting in the style of Bada Shanren on pale rice paper, made with a few bold,
  spontaneous strokes of wet and dry ink and vast empty space. Forms are reduced to their
  essence: a single shape rendered in a handful of brushstrokes, ink pooling dark or breaking
  dry and feathered at the edges. The composition is off-balance and daring, the subject set to
  one side with vast empty paper around it, with an odd, aloof character — a creature with a
  sidelong glare, a rock top-heavy and precarious. Austere, eccentric and profound.
signature_lead: "A Chinese ink painting in the style of Bada Shanren, a few bold spontaneous strokes on pale rice paper, vast emptiness."
signature_close: "A few bold ink strokes, wet and dry, vast empty paper, an austere eccentric calm, black and white."
