code: haunting-wet-plate-children
label_zh: 濕版瑕疵幽夢
aspect: '4:3'
palette: monochrome
look_paragraph: >
  A haunting wet-plate collodion photograph, soft and dreamlike, in silvery tones with a faint
  antique cast. The plate carries its chemical flaws: scratches, streaks, pour marks, light
  leaks, blurred halos and a dark vignette that swallows the corners. A glowing haze softens the
  highlights while deep shadow pools low in the frame, and parts of the picture melt into soft
  focus as if time itself had moved during the exposure. The subject seems both present and
  already becoming memory. The haze and scratches make it tender and intimate, shadowed by
  decay, faintly ominous.
signature_lead: A haunting wet-plate collodion photograph, silvery and dreamlike, scratched and haloed by antique chemical flaws.
signature_close: Wet-plate flaws, glowing haze, dark vignette, a tender and faintly ominous dream, black and white.
