code: sargent_watercolor_style
label_zh: "沙金特爽利水彩 (sargent_watercolor_style)"
medium: painting
aspect: '3:2'
palette: colour
look_paragraph: >
  A watercolour in the style of Sargent, painted fast and confident: broad, wet washes laid in
  single strokes, crisp dry-brush accents, and bright untouched white paper standing in for
  sunlight. Colour is fresh and transparent, blooming where wet meets wet, sharp where the brush
  was lifted. Shadows are luminous and cool, highlights left as paper, detail suggested rather
  than drawn. The composition is casual and close, often cropped like a glance, with reflections
  and dappled light doing most of the work. Sunlit, spontaneous and brilliantly economical.
signature_lead: "A watercolour in the style of Sargent, fast wet washes and crisp strokes, white paper as sunlight."
signature_close: "Transparent wet washes, crisp dry-brush accents, white paper for sunlight, spontaneous brilliance."
