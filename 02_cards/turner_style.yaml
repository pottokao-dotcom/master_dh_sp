code: turner_style
label_zh: "透納大氣光霧 (turner_style)"
medium: painting
aspect: '3:2'
palette: colour
look_paragraph: >
  A painting in the style of Turner, the scene dissolving into light, mist, spray and weather.
  Thin washes and veils of colour — pale gold, amber, silver and sea-grey — sweep across the
  surface, and a blazing sun or glow sits at the heart of the picture, swallowing outlines.
  Solid forms appear as faint suggestions inside swirling atmosphere, with a few sharp touches
  of darker paint. The paint is thin and scraped in places, thick and flicked in others. Loose,
  sweeping and sublime, the elements themselves as the subject.
signature_lead: "A painting in the style of Turner, the scene dissolving into swirling light, mist and golden haze."
signature_close: "Veils of gold and silver light, swirling atmosphere, forms dissolving, sublime and elemental."
