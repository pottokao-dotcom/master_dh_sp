code: durer_style
label_zh: "杜勒銅版線刻 (durer_style)"
medium: painting
aspect: '4:5'
palette: monochrome
look_paragraph: >
  A copper engraving in the style of Dürer, rendered entirely in fine, precise black lines on
  white paper. Tone is built from hatching and cross-hatching, lines swelling and tapering to
  model every curve, and textures — fur, stone, cloth, wood, hair — are described line by line
  with astonishing detail. Deep shadows are dense networks of crossed lines; lights are bare
  paper. Composition is packed with symbolic, meticulously observed objects. Every contour is
  firm and deliberate, with nothing left vague. Rigorous, learned and solemn.
signature_lead: "A copper engraving in the style of D\u00fcrer, fine black hatched and cross-hatched lines on white paper."
signature_close: "Fine engraved lines, dense cross-hatching, meticulous textures, rigorous and solemn, black and white."
