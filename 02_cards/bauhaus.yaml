palette: colour
look_paragraph: >
  A Bauhaus design built from primary colours and basic shapes: a red square, a yellow triangle,
  a blue circle, black bars and thin rules arranged on an asymmetric grid over white or cream
  paper. Lettering is lowercase geometric sans-serif, set in bold bands and vertical lines,
  sometimes rotated. The picture sits in a clean rectangle or circle held within the grid of
  shapes. Printing is flat and crisp on matte paper. Functional, rational and playful, every
  element placed with intent.
picture_paragraph: "The picture is reduced to basic geometric shapes in primary colours, or a clean black-and-white photograph set in a rectangle."
page_paragraph: "The page is built from primary colours and basic shapes: a red square, a yellow triangle, a blue circle, black bars and thin rules on an asymmetric grid over white or cream paper. The picture is set in a clean rectangle or circle within that grid, reproduced as it is. Lettering is lowercase geometric sans-serif in bold bands and vertical lines, sometimes rotated. Printing is flat and crisp on matte paper."   # v4.1 複合專用:設計師第二棒,只管頁面,不重畫圖
