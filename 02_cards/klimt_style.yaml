adult_mood: true
look_paragraph: >
  A painting in the style of Klimt: flat, shimmering fields of gold leaf and ornament surround
  naturalistically painted faces and hands. Robes, backgrounds and surfaces dissolve into mosaic
  patterns — spirals, circles, rectangles, eyes and flowers — in gold, bronze and jewel colours,
  flat as a Byzantine icon, while skin is soft, pale and delicately modelled. Figures press
  close to the picture plane, embraced by pattern, the edges of body and ornament merging.
  Sensual, decorative and dreamlike, sumptuous and melancholy at once.
