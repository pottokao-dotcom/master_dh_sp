  close: closer on the staged forms, still set against empty ground
  wide: the subject placed deadpan in vast bright emptiness, a low horizon
habitual_subjects: >
  sand dunes, family members in formal dress, bowler hats, umbrellas, chairs and everyday
  objects used as props
presets:
