look_paragraph: >
  An intimate, ritual snapshot on saturated 1970s consumer colour film, lit by a direct flash:
  the nearest skin and fabric blown bright, a hard shadow thrown behind, the room falling to
  black. The camera stays close and a little tilted. Wherever rope, cord, cloth or binding is
  part of the scene, the camera follows its knots and geometry where they press into skin and
  fabric, leaving grooves and faint marks. A person in the frame is restrained yet fully present
  — head heavy to one side, eyes half-lidded and far away, the body languid and taut at once.
  Deep reds, warm cast, low-fi grain; desire and mortality in one charged stillness.
signature_lead: An intimate, ritual direct-flash snapshot on saturated 1970s colour film, deep reds and a hard shadow behind.
signature_close: Flat hard flash, deep reds, a restrained yet present body, a charged ritual stillness.
